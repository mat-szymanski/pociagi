# Co 5 minut zbiera dane z API PKP PLK i, gdy są nowe, publikuje stronę (licznik + mapa) na GitHub Pages.
# Wymaga: sekretu PKP_PLK_APIKEY oraz Settings -> Pages -> Source: "GitHub Actions".
# Repozytorium publiczne: minuty Actions są darmowe (ok. 290 przebiegów na dobę). W prywatnym nie zmieści
# się w limicie minut, a Pages wymaga tam planu Pro.
name: Zbieranie danych

on:
  schedule:
    - cron: "2-59/5 * * * *"  # nie o pełnej godzinie - wtedy GitHub najczęściej opóźnia zadania
  workflow_dispatch:
  # zmiana strony lub skryptów: opublikuj od razu, nie czekając na nowe dane z PLK
  push:
    branches: [main]
    paths: ["static/**", "*.py", ".github/workflows/collect.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v6

      - id: day
        run: echo "day=$(TZ=Europe/Warsaw date +%F)" >> "$GITHUB_OUTPUT"

      # rozkład (numery pociągów) i przewoźnicy pobierani z API raz na dobę
      - uses: actions/cache@v6
        with:
          path: data
          key: plk-v2-${{ steps.day.outputs.day }}  # v2: pełny rozkład z numerami pociągów

      - id: collect
        name: Zbierz dane z PKP PLK
        env:
          PKP_PLK_APIKEY: ${{ secrets.PKP_PLK_APIKEY }}
          HISTORY_URL: ${{ steps.pages.outputs.base_url }}/data
        # z harmonogramu tylko przy nowych danych; po pushu i ręcznie zawsze pełna migawka i wdrożenie
        run: python collect.py ${{ github.event_name != 'schedule' && '--force' || '' }}

      - if: steps.collect.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: static

      - if: steps.collect.outputs.changed == 'true'
        id: deploy
        uses: actions/deploy-pages@v5
