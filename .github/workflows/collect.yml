# Co 5 minut zbiera dane z API PKP PLK i, gdy są nowe, publikuje stronę (licznik + mapa) na GitHub Pages.
# Wymaga: sekretu PKP_PLK_APIKEY oraz Settings -> Pages -> Source: "GitHub Actions".
# Repozytorium publiczne: minuty Actions są darmowe (ok. 290 przebiegów na dobę). W prywatnym nie zmieści
# się w limicie minut, a Pages wymaga tam planu Pro.
name: Zbieranie danych

on:
  # Harmonogram GitHuba bywa uruchamiany co 30 min albo rzadziej - głównym zegarem jest cron na serwerze
  # (tools/trigger.sh co 5 min wywołuje workflow_dispatch); harmonogram zostaje jako zapas.
  schedule:
    - cron: "2-59/5 * * * *"  # nie o pełnej godzinie - wtedy GitHub najczęściej opóźnia zadania
  workflow_dispatch:
    inputs:
      force:
        description: "Pełna migawka i publikacja, nawet gdy PLK nie ma nowych danych"
        type: boolean
        default: false
  # zmiana strony lub skryptów: opublikuj od razu, nie czekając na nowe dane z PLK
  push:
    branches: [main]
    paths: ["static/**", "*.py", ".github/workflows/collect.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v6

      - id: day
        run: echo "day=$(TZ=Europe/Warsaw date +%F)" >> "$GITHUB_OUTPUT"

      # rozkład (numery pociągów) i przewoźnicy pobierani z API raz na dobę
      - uses: actions/cache@v6
        with:
          path: data
          key: plk-v2-${{ steps.day.outputs.day }}  # v2: pełny rozkład z numerami pociągów

      - id: collect
        name: Zbierz dane z PKP PLK
        env:
          PKP_PLK_APIKEY: ${{ secrets.PKP_PLK_APIKEY }}
          HISTORY_URL: ${{ steps.pages.outputs.base_url }}/data
        # z harmonogramu i crona tylko przy nowych danych; po pushu (i ręcznie z "force") zawsze pełna migawka
        run: python collect.py ${{ (github.event_name == 'push' || inputs.force) && '--force' || '' }}

      - if: steps.collect.outputs.changed == 'true'
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: static

      # Własna publikacja (to samo API co actions/deploy-pages), bo:
      # - GitHub Pages pomija publikację z numerem wersji, który już był (od 25.11.2026 strona przestała się
      #   odświeżać), a deploy-pages bierze go z GITHUB_SHA, którego nie da się nadpisać - przy samych
      #   zmianach danych to ciągle ten sam commit; tu każdy przebieg ma własny numer (SHA-1 z commita i przebiegu),
      # - deploy-pages szuka paczki listowaniem artefaktów, które bywa zawodne ("No artifacts named github-pages");
      #   tu numer paczki przychodzi wprost z kroku upload,
      # - do 3 prób przy błędzie albo przekroczonym czasie.
      - if: steps.collect.outputs.changed == 'true'
        id: deploy
        uses: actions/github-script@v9
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const crypto = require("crypto");
            const { owner, repo } = context.repo;
            const version = crypto.createHash("sha1")
              .update(`${context.sha}-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`).digest("hex");
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            const FINAL = ["deployment_failed", "deployment_content_failed", "deployment_cancelled", "deployment_lost"];
            for (let attempt = 1; ; attempt++) {
              try {
                const { data } = await github.request("POST /repos/{owner}/{repo}/pages/deployments", {
                  owner, repo, artifact_id: Number(process.env.ARTIFACT_ID),
                  pages_build_version: version, oidc_token: await core.getIDToken() });
                const id = data.id || data.status_url.split("/").pop();
                core.info(`Publikacja ${version} (paczka ${process.env.ARTIFACT_ID}), id ${id}`);
                for (let i = 0; i < 48; i++) {  // do 4 min
                  await sleep(5000);
                  const { data: st } = await github.request("GET /repos/{owner}/{repo}/pages/deployments/{id}", { owner, repo, id });
                  if (st.status === "succeed") { core.info("Opublikowano."); core.setOutput("page_url", data.page_url); return; }
                  if (FINAL.includes(st.status)) throw new Error(`status ${st.status}`);
                  core.info(`status: ${st.status}`);
                }
                throw new Error("przekroczony czas publikacji");
              } catch (e) {
                if (attempt >= 3) throw e;
                core.warning(`Próba ${attempt}: ${e.message} - ponawiam za 20 s`);
                await sleep(20000);
              }
            }
