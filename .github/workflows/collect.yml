# Co 5 minut zbiera dane z API PKP PLK i, gdy są nowe, publikuje stronę (licznik + mapa) na GitHub Pages.
# Wymaga: sekretu PKP_PLK_APIKEY oraz Settings -> Pages -> Source: "GitHub Actions".
# Repozytorium publiczne: minuty Actions są darmowe (ok. 290 przebiegów na dobę). W prywatnym nie zmieści
# się w limicie minut, a Pages wymaga tam planu Pro.
name: Zbieranie danych

on:
  # Harmonogram GitHuba bywa uruchamiany co 30 min albo rzadziej - głównym zegarem jest cron na serwerze
  # (tools/trigger.sh co 5 min wywołuje workflow_dispatch); harmonogram zostaje jako zapas.
  schedule:
    - cron: "2-59/5 * * * *"  # nie o pełnej godzinie - wtedy GitHub najczęściej opóźnia zadania
  workflow_dispatch:
    inputs:
      force:
        description: "Pełna migawka i publikacja, nawet gdy PLK nie ma nowych danych"
        type: boolean
        default: false
  # zmiana strony lub skryptów: opublikuj od razu, nie czekając na nowe dane z PLK
  push:
    branches: [main]
    paths: ["static/**", "*.py", ".github/workflows/collect.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v6

      - id: day
        run: echo "day=$(TZ=Europe/Warsaw date +%F)" >> "$GITHUB_OUTPUT"

      # rozkład (numery pociągów) i przewoźnicy pobierani z API raz na dobę
      - uses: actions/cache@v6
        with:
          path: data
          key: plk-v2-${{ steps.day.outputs.day }}  # v2: pełny rozkład z numerami pociągów

      - id: collect
        name: Zbierz dane z PKP PLK
        env:
          PKP_PLK_APIKEY: ${{ secrets.PKP_PLK_APIKEY }}
          HISTORY_URL: ${{ steps.pages.outputs.base_url }}/data
        # z harmonogramu i crona tylko przy nowych danych; po pushu (i ręcznie z "force") zawsze pełna migawka
        run: python collect.py ${{ (github.event_name == 'push' || inputs.force) && '--force' || '' }}

      - if: steps.collect.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: static

      # GitHub Pages pomija publikację z numerem wersji, który już był (od 25.11.2026 strona przestała się
      # odświeżać), a deploy-pages bierze go z GITHUB_SHA - przy samych zmianach danych to ciągle ten sam
      # commit. Każdy przebieg dostaje więc własny numer: SHA-1 z commita i numeru przebiegu.
      - if: steps.collect.outputs.changed == 'true'
        id: build
        run: echo "version=$(printf '%s' "$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" | sha1sum | cut -c1-40)" >> "$GITHUB_OUTPUT"

      # deploy-pages czasem nie widzi świeżo wysłanej paczki ("No artifacts named github-pages") -
      # chwilowy błąd GitHuba, więc jedna ponowna próba po 30 s
      - if: steps.collect.outputs.changed == 'true'
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5
        env:
          GITHUB_SHA: ${{ steps.build.outputs.version }}

      - if: steps.collect.outputs.changed == 'true' && steps.deploy.outcome == 'failure'
        run: sleep 30

      - if: steps.collect.outputs.changed == 'true' && steps.deploy.outcome == 'failure'
        id: deploy-retry
        uses: actions/deploy-pages@v5
        env:
          GITHUB_SHA: ${{ steps.build.outputs.version }}
