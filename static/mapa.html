<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa pociągów</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --chip: #eef4fc;
    --route: #2a78d6;
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --grid: #2c2c2a;
      --border: rgba(255, 255, 255, 0.10);
      --chip: #1f2a38;
      --route: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --grid: #2c2c2a;
    --border: rgba(255, 255, 255, 0.10);
    --chip: #1f2a38;
    --route: #3987e5;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #map { position: absolute; inset: 0; background: var(--page); }
  .leaflet-container { font: inherit; }
  /* podkład OSM wyciszony, żeby kolory pociągów i opóźnień były najgłośniejsze */
  .basemap { filter: grayscale(1) contrast(0.85) brightness(1.08); }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .basemap { filter: grayscale(1) invert(1) brightness(0.75) contrast(0.9); }
  }
  :root[data-theme="dark"] .basemap { filter: grayscale(1) invert(1) brightness(0.75) contrast(0.9); }
  .leaflet-control-attribution { font-size: 11px; }

  .panel {
    position: absolute; z-index: 1000; top: 12px; left: 12px; width: 340px; max-height: calc(100% - 24px);
    overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
  }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .status-error { color: var(--critical); }
  nav { display: flex; gap: 4px; margin: 8px 0 12px; }
  nav a { color: var(--ink-2); text-decoration: none; padding: 3px 10px; border-radius: 8px; }
  nav a:hover { background: var(--chip); }
  nav a[aria-current] { color: var(--ink); font-weight: 600; background: var(--chip); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  input[type="search"] {
    font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 8px; width: 100%;
  }
  select {
    font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 8px; max-width: 100%;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    font: inherit; font-size: 13px; color: var(--ink-2); background: transparent; border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 10px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--chip); color: var(--ink); font-weight: 600; }
  label.toggle { display: flex; gap: 6px; align-items: center; color: var(--ink-2); cursor: pointer; }

  .legend { display: grid; gap: 4px; margin-top: 12px; }
  .legend h3 { font-size: 12px; font-weight: 500; color: var(--muted); margin: 6px 0 0; }
  .legend .item { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; }
  .dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); }
  .legend b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .legend svg { display: block; }

  /* pociąg: SVG w barwach przewoźnika, obracany wzdłuż toru; otoczka = opóźnienie */
  .train { background: none; border: 0; }
  .train .t { position: relative; width: 34px; height: 34px; transform: scale(var(--s, 1)); transition: transform 0.15s; }
  .train .rot { position: absolute; left: 0; top: 10px; width: 34px; height: 14px; transition: transform 1.5s linear; }
  .train .halo { fill: none; stroke: var(--halo, transparent); stroke-width: 2; }
  .train .lv0 .halo { stroke: rgba(0, 0, 0, 0.5); stroke-width: 0.8; }
  /* poświata pod opóźnionym pociągiem: im większe opóźnienie, tym większa plama */
  .train .aura {
    position: absolute; left: 50%; top: 50%; width: var(--aura, 0px); height: var(--aura, 0px);
    transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, var(--halo) 0%, var(--halo) 38%, transparent 70%); opacity: 0.85;
  }
  .train .lv1 { --aura: 30px; }
  .train .lv2 { --aura: 40px; }
  .train .lv3 { --aura: 52px; }
  /* tryb "kolory wg opóźnienia": cały wagonik w kolorze opóźnienia, bez barw przewoźnika */
  #map.by-delay .train .body { fill: var(--lvc); }
  #map.by-delay .train .liv { display: none; }
  #map.by-delay .train .aura { opacity: 0.45; }
  .train .lbl {
    position: absolute; left: 50%; bottom: 33px; transform: translateX(-50%); display: none; z-index: 2;
    font: 600 11px/1 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 2px 5px; border-radius: 999px;
    background: var(--halo); color: var(--lbl-ink, #fff); white-space: nowrap; box-shadow: 0 0 0 1.5px var(--surface);
  }
  #map.labels .train .lbl { display: block; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .seg button { font: inherit; font-size: 13px; color: var(--ink-2); background: transparent; border: 0; padding: 3px 10px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--chip); color: var(--ink); font-weight: 600; }
  .legend .swatch { width: 30px; height: 16px; display: grid; place-items: center; }
  .legend .swatch span { width: var(--w); height: var(--w); border-radius: 50%;
    background: radial-gradient(circle, var(--c) 0%, var(--c) 38%, transparent 70%); }
  .train.selected .t { transform: scale(calc(var(--s, 1) * 1.45)); }
  .train.selected .lv0 .halo { stroke: var(--ink); stroke-width: 2.4; }
  .train.selected .halo { stroke-width: 3; }

  .detail { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--grid); }
  .detail-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .close { font: inherit; font-size: 18px; line-height: 1; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0 4px; }
  .delay-big { font-size: 28px; font-weight: 600; margin: 6px 0 2px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--muted); padding: 4px 4px; border-bottom: 1px solid var(--grid); }
  td { padding: 5px 4px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.past td { color: var(--muted); }
  tr.cancelled td { text-decoration: line-through; color: var(--muted); }

  .tip { font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .leaflet-tooltip.tip { background: var(--surface); color: var(--ink); border: 1px solid var(--border); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15); }
  .leaflet-tooltip-top.tip::before { border-top-color: var(--surface); }

  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .collapse { display: none; font: inherit; font-size: 13px; color: var(--ink-2); background: var(--chip); border: 0; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  @media (max-width: 640px) {
    .panel { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; max-height: 48%; padding: 12px 14px; }
    .collapse { display: inline-block; }
    .panel.collapsed #panel-body { display: none; }
  }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Mapa pociągów w trasie"></div>

<aside class="panel">
  <div class="panel-head"><h1>Mapa pociągów</h1>
    <button class="collapse" id="collapse" aria-expanded="true" aria-controls="panel-body">Zwiń</button></div>
  <div id="panel-body">
  <nav><a href="./">Licznik</a><a href="mapa.html" aria-current="page">Mapa pociągów</a><a href="dyspozytornia.html">Dyspozytornia</a></nav>
  <div class="muted" id="status">Ładowanie…</div>
  <div class="muted">Pozycja szacowana z czasów przejazdu przez stacje, wzdłuż torów (PLK nie udostępnia GPS).</div>

  <div class="row">
    <input id="search" type="search" placeholder="Numer lub nazwa pociągu" aria-label="Szukaj pociągu" autocomplete="off">
    <select id="carrier" aria-label="Przewoźnik"><option value="">Wszyscy przewoźnicy</option></select>
  </div>
  <div class="row chips" role="group" aria-label="Minimalne opóźnienie" id="min-delay">
    <button class="chip" data-min="0" aria-pressed="true">Wszystkie</button>
    <button class="chip" data-min="6">od 6 min</button>
    <button class="chip" data-min="20">od 20 min</button>
    <button class="chip" data-min="60">od 60 min</button>
  </div>
  <div class="row"><span class="muted">Kolory:</span>
    <span class="seg" role="group" aria-label="Kolory pociągów" id="color-mode">
      <button data-mode="carrier" aria-pressed="true">przewoźnik</button><button data-mode="delay" aria-pressed="false">opóźnienie</button>
    </span></div>
  <div class="row"><label class="toggle"><input type="checkbox" id="rails" checked> Pokaż tory (OpenRailwayMap)</label></div>

  <div class="legend" id="legend"></div>
  <div id="detail"></div>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const clock = (sec) => new Date(sec * 1000).toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Warsaw" });
const LEVELS = [
  { min: 0, label: "0–5 min", color: "--good" },
  { min: 6, label: "6–19 min", color: "--warning" },
  { min: 20, label: "20–59 min", color: "--serious" },
  { min: 60, label: "60 min i więcej", color: "--critical" },
];
const level = (d) => LEVELS.reduce((acc, l) => (d >= l.min ? l : acc), LEVELS[0]);

// Barwy przewoźników (przybliżone): podstawa wagonu, pas, czoło. Łatwo poprawić w jednym miejscu.
const LIVERIES = {
  IC: { base: "#c9ced6", stripe: "#2f6fc4", nose: "#15275a" },     // PKP Intercity: szaro-niebiesko-granatowe
  KD: { base: "#ffffff", stripe: "#f6c400", nose: "#f6c400" },     // Koleje Dolnośląskie: żółto-białe
  PR: { base: "#ffffff", stripe: "#d6001c", nose: "#d6001c" },     // POLREGIO: czerwono-białe
  KM: { base: "#ffffff", stripe: "#00843d", nose: "#ffcc00" },     // Koleje Mazowieckie: zielono-żółte
  KS: { base: "#ffffff", stripe: "#0064b4", nose: "#ffd400" },     // Koleje Śląskie
  KW: { base: "#ffffff", stripe: "#c4161c", nose: "#262626" },     // Koleje Wielkopolskie
  "ŁKA": { base: "#ffffff", stripe: "#e2001a", nose: "#ffd200" },  // Łódzka Kolej Aglomeracyjna
  "KMŁ": { base: "#ffffff", stripe: "#0057a4", nose: "#e30613" },  // Koleje Małopolskie
  SKMT: { base: "#f5c400", stripe: "#00529f", nose: "#00529f" },   // SKM w Trójmieście: żółto-niebieskie
  SKM: { base: "#ffffff", stripe: "#e30613", nose: "#ffd200" },    // SKM Warszawa
  WKD: { base: "#ffffff", stripe: "#0067b1", nose: "#0067b1" },    // Warszawska Kolej Dojazdowa
  AR: { base: "#ffffff", stripe: "#00a7b5", nose: "#00a7b5" },     // Arriva
  RJ: { base: "#fdd800", stripe: "#1f1f1f", nose: "#fdd800" },     // RegioJet
  "Leo Express": { base: "#2b2b2b", stripe: "#e3a14a", nose: "#2b2b2b" },
  LEO: { base: "#2b2b2b", stripe: "#e3a14a", nose: "#2b2b2b" },
};
const OTHER_LIVERY = { base: "#e2e2e2", stripe: "#6b6b6b", nose: "#6b6b6b" };
const livery = (c) => LIVERIES[c] || OTHER_LIVERY;
const LBL_INK = ["#111", "#111", "#111", "#fff"];  // kolor liczby na tle otoczki (żółte/pomarańczowe tło - ciemny)

// pociąg skierowany w prawo (czoło po prawej), 34x14; obrót robi CSS
function trainSvg(c, w = 34, h = 14, cls = "rot") {
  const l = livery(c);
  return `<svg class="${cls}" viewBox="0 0 34 14" width="${w}" height="${h}" aria-hidden="true">
    <rect class="halo" x="0.8" y="0.8" width="32.4" height="12.4" rx="6.2"/>
    <path class="body" d="M4,3 H25 Q31,3 31,7 Q31,11 25,11 H4 Q3,11 3,10 V4 Q3,3 4,3 Z" fill="${l.base}" stroke="var(--surface)" stroke-width="1.2"/>
    <rect class="liv" x="3.6" y="6" width="24" height="2" fill="${l.stripe}"/>
    <path class="liv" d="M25,3 Q31,3 31,7 Q31,11 25,11 Z" fill="${l.nose}"/>
    <path d="M12,3.6 V10.4 M20,3.6 V10.4" stroke="rgba(0,0,0,0.25)" stroke-width="0.8"/>
  </svg>`;
}

// --- mapa ---
const dark = matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.dataset.theme !== "light";
const map = L.map("map", { zoomControl: false, preferCanvas: true }).fitBounds([[49.0, 14.1], [54.85, 24.15]]);
L.control.zoom({ position: "topright" }).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, className: "basemap",
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
}).addTo(map);
const rails = L.tileLayer("https://{s}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png", {
  maxZoom: 19, subdomains: "abc", opacity: dark ? 0.3 : 0.35,
  attribution: '<a href="https://www.openrailwaymap.org/">OpenRailwayMap</a>',
}).addTo(map);
map.attributionControl.addAttribution('Dane: <a href="https://www.plk-sa.pl/klienci-i-kontrahenci/api-otwarte-dane">PKP PLK</a> · stacje i przebieg torów: <a href="https://github.com/JanKemnitz/PolishTrainsGTFS">PolishTrainsGTFS</a> (CC0)');
$("rails").addEventListener("change", (e) => (e.target.checked ? rails.addTo(map) : rails.remove()));

// wielkość pociągów i etykiety opóźnień zależą od przybliżenia
function applyZoom() {
  const z = map.getZoom(), el = $("map");
  el.style.setProperty("--s", z <= 6 ? 0.5 : z === 7 ? 0.62 : z === 8 ? 0.78 : z <= 10 ? 0.95 : 1.2);
  el.classList.toggle("labels", z >= 8);
}
map.on("zoomend", applyZoom);
applyZoom();

map.createPane("route").style.zIndex = 350;  // pod kropkami pociągów (overlayPane = 400)
const routeRenderer = L.canvas({ padding: 0.3, pane: "route" });
const routeLayer = L.layerGroup().addTo(map);
const trainLayer = L.layerGroup().addTo(map);

let stations = {}, segments = {}, data = null, selected = null;

// --- przebieg torów między stacjami (data/segments.json, zakodowane polilinie, klucz "a_b" = kierunek a→b) ---
function decodePolyline(str) {
  const pts = [];
  let i = 0, lat = 0, lon = 0;
  while (i < str.length) {
    for (const k of [0, 1]) {
      let r = 0, sh = 0, b;
      do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32);
      const v = r & 1 ? ~(r >> 1) : r >> 1;
      if (k === 0) lat += v; else lon += v;
    }
    pts.push([lat / 1e5, lon / 1e5]);
  }
  return pts;
}

const segCache = new Map();
function segment(a, b) {
  const key = `${a}_${b}`;
  if (segCache.has(key)) return segCache.get(key);
  let pts;
  if (segments[key]) pts = decodePolyline(segments[key]);
  else if (segments[`${b}_${a}`]) pts = decodePolyline(segments[`${b}_${a}`]).reverse();
  else pts = [stations[a], stations[b]];  // brak przebiegu: prosta między stacjami
  const cum = [0];
  for (let k = 1; k < pts.length; k++) cum.push(cum[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], (pts[k][1] - pts[k - 1][1]) * 0.63));
  const seg = { pts, cum, len: cum[cum.length - 1] };
  segCache.set(key, seg);
  return seg;
}

// punkt w ułamku f długości odcinka (wzdłuż torów)
function pointAt(seg, f) {
  const target = seg.len * f;
  let k = 1;
  while (k < seg.cum.length - 1 && seg.cum[k] < target) k++;
  const span = seg.cum[k] - seg.cum[k - 1] || 1;
  const t = Math.min(Math.max((target - seg.cum[k - 1]) / span, 0), 1);
  const p = seg.pts[k - 1], q = seg.pts[k];
  return [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t];
}
// kierunek odcinka w ułamku f, w stopniach na ekranie (0 = na wschód, dodatnie zgodnie z ruchem wskazówek zegara)
function headingAt(seg, f) {
  const target = seg.len * f;
  let k = 1;
  while (k < seg.cum.length - 1 && seg.cum[k] < target) k++;
  const p = seg.pts[k - 1], q = seg.pts[k];
  return Math.atan2(-(q[0] - p[0]), (q[1] - p[1]) * Math.cos(p[0] * Math.PI / 180)) * 180 / Math.PI;
}

const markers = new Map();
const filters = { carrier: "", min: 0, q: "" };

// kolory pociągów: barwy przewoźnika + poświata opóźnienia albo cały pociąg w kolorze opóźnienia (zapamiętane)
let colorMode = "carrier";
try { colorMode = localStorage.getItem("kolej-color-mode") === "delay" ? "delay" : "carrier"; } catch {}
function setColorMode(mode) {
  colorMode = mode;
  $("map").classList.toggle("by-delay", mode === "delay");
  for (const b of $("color-mode").children) b.setAttribute("aria-pressed", b.dataset.mode === mode);
  try { localStorage.setItem("kolej-color-mode", mode); } catch {}
  update();
}

// --- pozycja: interpolacja między stacjami po czasach rzeczywistych (potwierdzonych) i prognozowanych ---
const arr = (s) => s[1] || s[2];
const dep = (s) => s[2] || s[1];

function stopsOf(tr) {
  return tr.s.filter((s) => stations[s[0]] && !s[5]);
}

function locate(tr, now) {
  const s = stopsOf(tr);
  if (!s.length) return null;
  let lastConf = -1;
  s.forEach((x, i) => { if (x[4]) lastConf = i; });
  // Jeśli już w chwili publikacji danych pociąg powinien był wg prognozy minąć następną stację,
  // a PLK tego nie potwierdził, to jest później niż prognoza: przesuwamy resztę trasy o tę różnicę.
  const next = lastConf + 1;
  const extra = next > 0 && next < s.length ? Math.max(0, data.epoch - arr(s[next])) : 0;
  const A = (i) => arr(s[i]) + (i >= next ? extra : 0);
  const D = (i) => dep(s[i]) + (i >= next ? extra : 0);
  let pos = null;
  if (now <= D(0)) pos = { i: 0, f: 0 };
  for (let i = 0; !pos && i < s.length; i++) {
    if (now >= A(i) && now <= D(i)) pos = { i, f: 0 };
    else if (i + 1 < s.length && now > D(i) && now < A(i + 1)) {
      pos = { i, f: (now - D(i)) / Math.max(A(i + 1) - D(i), 1) };
    }
  }
  if (!pos) pos = { i: s.length - 1, f: 0 };
  // na stacji pociąg "patrzy" w stronę następnej (na końcowej - tak jak przyjechał)
  const heading = pos.f ? headingAt(segment(s[pos.i][0], s[pos.i + 1][0]), pos.f)
    : pos.i + 1 < s.length ? headingAt(segment(s[pos.i][0], s[pos.i + 1][0]), 0)
    : pos.i > 0 ? headingAt(segment(s[pos.i - 1][0], s[pos.i][0]), 1) : 0;
  return {
    heading,
    latlng: pos.f ? pointAt(segment(s[pos.i][0], s[pos.i + 1][0]), pos.f) : stations[s[pos.i][0]],
    at: pos.f === 0 ? s[pos.i] : null,
    from: s[pos.i], to: pos.f ? s[pos.i + 1] : null, extraMin: Math.round(extra / 60),
    lastConfirmed: lastConf >= 0 ? s[lastConf] : null,
  };
}

function stationName(id) {
  return data.stationNames[id] || stations[id]?.[2] || id;
}

function trainTitle(tr) {
  const no = [tr.k, tr.no].filter(Boolean).join(" ");  // np. "IC 5122", "R 12242/3", "BUS 49011"
  return [no || data.carriers[tr.c] || tr.c, tr.n].filter(Boolean).join(" ");
}

// wyszukiwanie: numer (także fragment po ukośniku, np. "12243" dla "12242/3"), nazwa albo kategoria
function matches(tr, q) {
  if (!q) return true;
  const nums = (tr.no || "").split("/");
  const full = nums.map((n) => nums[0].slice(0, nums[0].length - n.length) + n);
  return full.some((n) => n.startsWith(q)) || trainTitle(tr).toLowerCase().includes(q);
}

function visible(tr) {
  return (!filters.carrier || tr.c === filters.carrier) && tr.d >= filters.min && matches(tr, filters.q);
}

function where(loc) {
  if (!loc) return "";
  // zwykle to zwłoka w potwierdzeniach PLK, a nie dodatkowe opóźnienie - mówimy wprost, czego brakuje
  const lc = loc.lastConfirmed;
  const more = loc.extraMin >= 15 && lc
    ? ` · ostatnie potwierdzenie PLK: ${esc(stationName(lc[0]))} o ${clock(dep(lc))}, pozycja przybliżona`
    : "";
  if (loc.at) return `na stacji: ${esc(stationName(loc.at[0]))}${more}`;
  return `jedzie: ${esc(stationName(loc.from[0]))} → ${esc(stationName(loc.to[0]))}${more}`;
}

function tooltipHtml(tr, loc) {
  const first = tr.s[0], last = tr.s[tr.s.length - 1];
  return `<b>${esc(trainTitle(tr))}</b> · <b>+${tr.d} min</b><br>` +
    `<span class="muted">${esc(stationName(first[0]))} → ${esc(stationName(last[0]))}</span><br>${where(loc)}`;
}

function update() {
  if (!data) return;
  const now = Date.now() / 1000;
  const counts = LEVELS.map(() => 0), byCarrier = {};
  let shown = 0;
  for (const tr of data.trains) {
    const m = markers.get(tr.id);
    const loc = visible(tr) ? locate(tr, now) : null;
    if (!loc) { if (m) trainLayer.removeLayer(m); continue; }
    shown++;
    counts[LEVELS.indexOf(level(tr.d))]++;
    byCarrier[tr.c] = (byCarrier[tr.c] || 0) + 1;
    if (!m) continue;
    m.setLatLng(loc.latlng);
    m._loc = loc;
    if (!trainLayer.hasLayer(m)) trainLayer.addLayer(m);
    rotate(m, loc.heading);
  }
  renderLegend(counts, byCarrier, shown);
  if (selected) {
    const m = markers.get(selected);
    if ($("where") && m?._loc) $("where").innerHTML = where(m._loc);
  }
}

function trainIcon(tr) {
  const li = LEVELS.indexOf(level(tr.d));
  const vars = `--lvc:var(${LEVELS[li].color});` + (li ? `--halo:var(${LEVELS[li].color});--lbl-ink:${LBL_INK[li]};` : "");
  return L.divIcon({
    className: `train${tr.id === selected ? " selected" : ""}`, iconSize: [34, 34], iconAnchor: [17, 17],
    html: `<div class="t lv${li}" style="${vars}">${li ? '<span class="aura"></span>' : ""}${trainSvg(tr.c)}` +
      `${li ? `<span class="lbl">+${tr.d}</span>` : ""}</div>`,
  });
}

function rotate(m, deg) {
  const el = m.getElement()?.querySelector(".rot");
  if (!el) return;
  // obrót o najkrótszy kąt, żeby przejście CSS nie kręciło pociągiem o 360°
  const prev = m._deg ?? deg;
  const next = prev + ((((deg - prev) % 360) + 540) % 360 - 180);
  m._deg = next;
  el.style.transform = `rotate(${next}deg)`;
}

function buildMarkers() {
  const seen = new Set();
  for (const tr of data.trains) {
    seen.add(tr.id);
    let m = markers.get(tr.id);
    if (!m) {
      m = L.marker([0, 0], { keyboard: false, icon: trainIcon(tr) });
      m.bindTooltip("", { className: "tip", direction: "top", offset: [0, -10] });
      m.on("tooltipopen", () => m.setTooltipContent(tooltipHtml(m._train, m._loc)));
      m.on("click", (e) => { e.originalEvent._onTrain = true; select(m._train.id === selected ? null : m._train.id); });
      m.on("add", () => { m._deg = undefined; if (m._loc) rotate(m, m._loc.heading); });
      markers.set(tr.id, m);
    } else if (m._key !== `${tr.c}|${tr.d}`) {
      m.setIcon(trainIcon(tr));
      m._deg = undefined;
    }
    m._key = `${tr.c}|${tr.d}`;
    m._train = tr;
    m.setZIndexOffset(tr.id === selected ? 100000 : tr.d * 10);  // bardziej opóźnione na wierzchu
  }
  for (const [id, m] of markers) if (!seen.has(id)) { trainLayer.removeLayer(m); markers.delete(id); }
}

function renderLegend(counts, byCarrier, shown) {
  const codes = Object.keys(byCarrier).sort((a, b) => byCarrier[b] - byCarrier[a]);
  const named = codes.filter((c) => LIVERIES[c]);
  const other = codes.filter((c) => !LIVERIES[c]).reduce((n, c) => n + byCarrier[c], 0);
  const byDelay = colorMode === "delay";
  const body = (li) => `<svg viewBox="0 0 34 14" width="30" height="13" aria-hidden="true"><path d="M4,3 H25 Q31,3 31,7 Q31,11 25,11 H4 Q3,11 3,10 V4 Q3,3 4,3 Z"
    fill="var(${LEVELS[li].color})" stroke="rgba(0,0,0,0.35)" stroke-width="0.8"/></svg>`;
  const aura = (li) => li ? `<span class="swatch"><span style="--c:var(${LEVELS[li].color});--w:${[0, 12, 15, 18][li]}px"></span></span>`
    : `<span class="swatch"></span>`;
  $("legend").innerHTML =
    (byDelay ? `<h3>Opóźnienie – kolor pociągu</h3>` : `<h3>Opóźnienie – kolorowa poświata pod pociągiem</h3>`) +
    LEVELS.map((l, i) => `<div class="item">${byDelay ? body(i) : aura(i)}<span>${l.label}${!byDelay && !i ? " (bez poświaty)" : ""}</span><b>${counts[i]}</b></div>`).join("") +
    (byDelay ? "" : `<h3>Przewoźnik – kolory pociągu</h3>` +
      named.map((c) => `<div class="item">${trainSvg(c, 30, 13, "")}<span>${esc(data.carriers[c] || c)}</span><b>${byCarrier[c]}</b></div>`).join("") +
      (other ? `<div class="item">${trainSvg("?", 30, 13, "")}<span>Pozostali</span><b>${other}</b></div>` : "")) +
    `<div class="muted">Na mapie: ${shown} z ${data.trains.length} pociągów w trasie</div>`;
}

// zaznaczenie pociągu: trasa i panel budowane raz, potem co 2 s odświeżany tylko opis położenia
function select(id) {
  const prev = selected;
  selected = id && data?.trains.some((t) => t.id === id) ? id : null;
  for (const tid of [prev, selected]) {
    const m = tid && markers.get(tid);
    if (!m) continue;
    m.getElement()?.classList.toggle("selected", tid === selected);
    m.setZIndexOffset(tid === selected ? 100000 : m._train.d * 10);
  }
  renderDetail();
}

function renderDetail() {
  const tr = data?.trains.find((t) => t.id === selected);
  routeLayer.clearLayers();
  if (!tr) { $("detail").innerHTML = ""; selected = null; return; }
  const loc = locate(tr, Date.now() / 1000);
  const s = stopsOf(tr);
  const line = s.slice(1).reduce((acc, x, k) => acc.concat(segment(s[k][0], x[0]).pts.slice(1)), [stations[s[0][0]]]);
  L.polyline(line, { renderer: routeRenderer, color: css("--route"), weight: 3, opacity: 0.85, interactive: false }).addTo(routeLayer);
  for (const x of s) L.circleMarker(stations[x[0]], { renderer: routeRenderer, radius: 3, weight: 1.5, color: css("--route"), fillColor: css("--surface"), fillOpacity: 1, interactive: false }).addTo(routeLayer);
  const lv = level(tr.d);
  const rows = tr.s.map((x) => {
    const t = arr(x), planned = t ? t - x[3] * 60 : 0;
    const cls = x[5] ? "cancelled" : x[4] ? "past" : "";
    return `<tr class="${cls}"><td>${esc(stationName(x[0]))}</td><td class="num">${t ? clock(planned) : "–"}</td>` +
      `<td class="num">${t ? clock(t) : "–"}</td><td class="num">${x[3] ? "+" + x[3] : "0"}</td></tr>`;
  }).join("");
  $("detail").innerHTML = `<div class="detail">
    <div class="detail-head"><div><h2>${esc(trainTitle(tr))}</h2>
      <div class="muted">${esc(data.carriers[tr.c] || tr.c)} · ${esc(stationName(tr.s[0][0]))} → ${esc(stationName(tr.s[tr.s.length - 1][0]))}</div></div>
      <button class="close" aria-label="Zamknij" id="close">×</button></div>
    <div class="delay-big">+${tr.d} min</div>
    <div class="badge"><span class="dot" style="background:var(${lv.color})"></span>${lv.label} · <span id="where">${where(loc)}</span></div>
    <table><thead><tr><th>Stacja</th><th class="num">Plan</th><th class="num">Rzecz./progn.</th><th class="num">Opóźn.</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="muted" style="margin-top:6px">Szare – stacje już potwierdzone przez PLK; pozostałe czasy to prognoza.</div></div>`;
  $("close").onclick = () => select(null);
}

function fillCarriers() {
  const sel = $("carrier"), cur = sel.value;
  const count = {};
  for (const tr of data.trains) count[tr.c] = (count[tr.c] || 0) + 1;
  const codes = Object.keys(count).filter((c) => c !== "?").sort((a, b) => count[b] - count[a]);
  sel.innerHTML = `<option value="">Wszyscy przewoźnicy</option>` +
    codes.map((c) => `<option value="${esc(c)}">${esc(data.carriers[c] || c)} (${count[c]})</option>`).join("");
  sel.value = codes.includes(cur) ? cur : "";
}

async function getJson(path) {
  const r = await fetch(`${path}?t=${Math.floor(Date.now() / 60000)}`);
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  return r.json();
}

async function load() {
  try {
    const fresh = await getJson("data/trains.json");
    const age = Math.round((Date.now() / 1000 - fresh.epoch) / 60);
    $("status").textContent = age > 30
      ? `Dane PLK sprzed ${age} min (${clock(fresh.epoch)}) – zbieranie danych mogło się zatrzymać`
      : `Dane PLK z ${clock(fresh.epoch)} · pozycje przeliczane na bieżąco`;
    $("status").className = age > 30 ? "muted status-error" : "muted";
    if (data && fresh.epoch === data.epoch) return;  // te same dane - nic nie przebudowujemy
    data = fresh;
    buildMarkers();
    fillCarriers();
    update();
    if (selected) select(selected);  // nowe dane: odśwież trasę i tabelę (albo zamknij, gdy pociąg dojechał)
  } catch (e) {
    $("status").textContent = `Nie udało się wczytać danych (${e.message})`;
    $("status").className = "muted status-error";
  }
}

// kliknięcie w puste miejsce mapy albo Esc zamyka trasę
map.on("click", (e) => { if (!e.originalEvent._onTrain && selected) select(null); });
addEventListener("keydown", (e) => { if (e.key === "Escape" && selected) select(null); });
$("collapse").addEventListener("click", () => {
  const collapsed = document.querySelector(".panel").classList.toggle("collapsed");
  $("collapse").textContent = collapsed ? "Rozwiń" : "Zwiń";
  $("collapse").setAttribute("aria-expanded", !collapsed);
});
$("search").addEventListener("input", (e) => { filters.q = e.target.value.trim().toLowerCase(); update(); });
// Enter: pokaż i zaznacz pierwszy pasujący pociąg
$("search").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !data) return;
  const hit = data.trains.find((t) => visible(t) && markers.get(t.id)?._loc);
  if (!hit) return;
  map.flyTo(markers.get(hit.id).getLatLng(), Math.max(map.getZoom(), 11), { duration: 0.8 });
  select(hit.id);
});
$("carrier").addEventListener("change", (e) => { filters.carrier = e.target.value; update(); });
$("color-mode").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setColorMode(b.dataset.mode); });
setColorMode(colorMode);
$("min-delay").addEventListener("click", (e) => {
  const b = e.target.closest(".chip");
  if (!b) return;
  filters.min = +b.dataset.min;
  for (const c of $("min-delay").children) c.setAttribute("aria-pressed", c === b);
  update();
});

Promise.all([getJson("data/stations.json"), getJson("data/segments.json").catch(() => ({}))])
  .then(([st, sg]) => { stations = st; segments = sg; return load(); });
setInterval(update, 2000);
setInterval(load, 60000);
</script>
</body>
</html>
